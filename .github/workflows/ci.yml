name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: Download pinned Bitcoin Core fixtures
        env:
          CORE_REVISION: f13ae519de94394314cd63a27924b0998ac65d45
        run: >-
          curl --fail --location --retry 3
          https://raw.githubusercontent.com/bitcoin/bitcoin/${CORE_REVISION}/src/test/data/script_tests.json
          --output script_tests.json
      - name: Audit pinned Bitcoin Core fixtures
        shell: bash
        run: |
          set -euo pipefail
          lake exe core_fixture_audit -- --show-details script_tests.json 2>&1 | tee core-fixture-audit.log
          grep --fixed-strings --line-regexp \
            'tests=1258 compared=1258 matched=1258 mismatched=0 unsupported=0 documentation=60' \
            core-fixture-audit.log
      - name: Upload Core audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-fixture-audit
          path: core-fixture-audit.log
          if-no-files-found: ignore
