name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: Test Core audit gate
        run: python3 -B -m unittest discover -s scripts -p 'test_check_core_fixture_audit.py' -v
      - name: Audit pinned Bitcoin Core fixtures
        shell: bash
        run: python3 scripts/check_core_fixture_audit.py 2>&1 | tee core-fixture-audit.log
      - name: Upload Core audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-fixture-audit
          path: core-fixture-audit.log
          if-no-files-found: ignore
